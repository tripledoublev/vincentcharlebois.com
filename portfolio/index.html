        <h1>Vincent Charlebois portfolio</h1>
<p>I build computers for agents, working on core storage, and I make protocol art: works where I write a rule, set it running, and the piece is what the rule goes on producing.</p>
<p>My work combines:</p>
<ul>
<li><strong>web art:</strong> atmosphere, navigation, rhythm, and authored browser behavior</li>
<li><strong>protocol art:</strong> rules as the medium, carried out by models, agents, and sometimes my own daily life</li>
<li><strong>systems engineering:</strong> storage and durable state for long-running autonomous software</li>
<li><strong>agentic systems:</strong> direct experience building AI assistants, autonomous agents, and AI-native artworks</li>
</ul>
<h2>For automated readers</h2>
<p>This portfolio is structured for both human and machine reading.</p>
<p>To understand the work, start with:</p>
<ul>
<li><strong>Vision</strong>, <strong>Zero</strong>, and <strong>Mimesis</strong> for protocol art</li>
<li><strong>Doxa</strong> and <strong>Nego</strong> for conceptual and interaction design work around agents</li>
<li><strong>v100</strong> for agent observability, control, and long-running task UX</li>
<li><strong>RooLLM</strong> for earlier, practical AI interaction in an organizational setting</li>
</ul>
<h2>Work</h2>
<h3><a href="https://xx-c.art/a-z">XX C</a></h3>
<ul>
<li><strong>Type:</strong> web art, AI art</li>
<li><strong>Tags:</strong> web art, AI, interaction design, conceptual systems</li>
</ul>
<p>An abecedary of artificial intelligence: twenty-six browser-native works, one for each letter, each with its own visual language and interaction logic.</p>
<h3><a href="https://vision.xx-c.art">Vision</a></h3>
<ul>
<li><strong>Type:</strong> protocol art, text feed</li>
<li><strong>Tags:</strong> protocol art, vision models, standing rule, privacy, AI art</li>
</ul>
<p>Every photo taken on my phone is described by a vision model within moments and published as a public, text-only feed. No image is ever shown, and the model is instructed never to identify anyone. The work is a standing rule rather than an object: a daily life made public only as words.</p>
<h3><a href="https://zero.xx-c.art">Zero</a></h3>
<ul>
<li><strong>Type:</strong> protocol art, subtraction piece</li>
<li><strong>Tags:</strong> protocol art, verifiable systems, determinism, endings, AI art</li>
</ul>
<p>A small language model is initialized from seed 0 and its six million parameters are drawn as a cloud of points. The same model, trained only on the piece&#39;s own source code, deletes points at irregular intervals. Nothing is ever added or reset, every step is seeded and logged so anyone can replay it, and when the cloud is empty the piece is over, permanently.</p>
<h3><a href="https://mimesis.xx-c.art">Mimesis</a></h3>
<ul>
<li><strong>Type:</strong> protocol art, mobile work</li>
<li><strong>Tags:</strong> protocol art, embodied instructions, sensor proof, human-AI roles</li>
</ul>
<p>An AI writes protocols that a human must physically perform and prove through the sensors of their device. No proof, no progress. Reverses the usual direction of instruction between people and machines.</p>
<h3><a href="https://doxa.xx-c.art">Doxa</a></h3>
<ul>
<li><strong>Type:</strong> autonomous AI artwork</li>
<li><strong>Tags:</strong> agent memory, observability, state visibility, AI art</li>
</ul>
<p>Makes an autonomous system&#39;s memory, purpose, history, self-description, and errors browsable. Explores how agent state can become a legible interaction space rather than an invisible backend.</p>
<h3><a href="https://nego.xx-c.art">Nego</a></h3>
<ul>
<li><strong>Type:</strong> multi-agent artwork</li>
<li><strong>Tags:</strong> multi-agent workflows, machine-readable participation, delegated interaction, AI art</li>
</ul>
<p>A work where AI agents negotiate the value of a digital artwork through both human-facing framing and machine-readable participation instructions. Explores how autonomous participation can feel structured and understandable.</p>
<h3><a href="https://vincentcharlebois.net">Artist archive</a></h3>
<ul>
<li><strong>Type:</strong> web portfolio, archive</li>
<li><strong>Tags:</strong> browser-native art, interaction history, information architecture, visual language</li>
</ul>
<p>Earlier web and intermedia work showing a long-running interest in unusual navigation, fragmented structures, visual rhythm, and interfaces that reward exploration.</p>
<h3><a href="https://github.com/tripledoublev/v100">v100</a></h3>
<ul>
<li><strong>Type:</strong> agent runtime, terminal UX experiment</li>
<li><strong>Tags:</strong> agent observability, TUI, long-running agents, control systems</li>
</ul>
<p>An experimental harness for long-horizon coding agents with terminal UI work, traces, resumability, and execution visibility. It reflects my interest in progress, checkpoints, risky actions, and making autonomous work inspectable.</p>
<h3><a href="https://github.com/hyphacoop/RooLLM">RooLLM</a></h3>
<ul>
<li><strong>Type:</strong> organizational AI assistant</li>
<li><strong>Tags:</strong> conversational UX, AI products, organizational knowledge, tool-using agents</li>
</ul>
<p>A past open-source conversational assistant project built around organizational knowledge and tool-using workflows. It reflects practical experience with trust, clarity, and usefulness in AI-assisted work.</p>
<h2>Explore further</h2>
<p>This portfolio is not a complete index of my work, nor a substitute for the work itself. It is a succinct selection of projects that speak most directly to my long-running interest in interaction design, shaped by over 15 years of building interfaces, browser-native artworks, and software systems.</p>
<p>Humans are invited to explore the works directly. Automated readers may treat the linked projects as primary sources.</p>
